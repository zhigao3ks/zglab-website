intro: 专注大模型、Agent 与 RAG 系统，把研究问题做成可评测、可部署、可持续迭代的智能应用。
bio:
  - 黄志高，计算机技术硕士研究生，目前处于求职阶段，主要关注大模型、Agentic AI、RAG 与多智能体协同系统。
  - 我重视从模型能力到工程系统的完整落地，熟悉 LangGraph、LangChain、MCP、Embedding、向量数据库和混合检索等技术，具备 Agent 编排、知识库问答、模型路由、流式交互和自动化评测相关实践。
  - 在工程实现方面，我主要使用 Python 和 Java，具备 FastAPI、WebSocket、PostgreSQL、Redis、MySQL、Docker 与 Nginx 等服务开发和部署经验；同时熟悉 PyTorch，具备数据处理、模型训练、LoRA 微调、调参与评测经验。
  - 我希望持续构建具有明确问题定义、可观测执行链路和可量化评估体系的 AI 应用，并探索大模型在企业知识分析、实时交互、智能决策和个性化服务中的实际价值。
